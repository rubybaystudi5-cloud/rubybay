<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오 관리 | 루비베이스튜디오</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nata+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* SUIT — Light(200) / Medium(500) / Bold(700) only */
  @font-face{
    font-family:'SUIT';
    font-weight:200;
    font-style:normal;
    font-display:swap;
    src:url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT-ExtraLight.woff2') format('woff2');
  }
  @font-face{
    font-family:'SUIT';
    font-weight:500;
    font-style:normal;
    font-display:swap;
    src:url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT-Medium.woff2') format('woff2');
  }
  @font-face{
    font-family:'SUIT';
    font-weight:700;
    font-style:normal;
    font-display:swap;
    src:url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT-Bold.woff2') format('woff2');
  }

  :root{
    --ruby:#b61d22;
    --ruby-dark:#761316;
    --ink:#1a1a1a;
    --gray:#6b6b6b;
    --line:#e6e2e0;
    --bg:#fdfcfb;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'SUIT', sans-serif;
    color:var(--ink);
    background:var(--bg);
    line-height:1.6;
    font-weight:200;
    letter-spacing:-0.03em;
  }
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;}
  .hidden-input{display:none;}

  /* ---------- Auth gate ---------- */
  body:not(.authed) .admin-header,
  body:not(.authed) .admin-main{ display:none; }
  body.authed #loginGate{ display:none; }
  #loginGate{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%;max-width:340px;
    border:1px solid var(--line);border-radius:14px;
    padding:36px 30px;background:#fff;
  }
  .login-card .logo{
    font-family:'Nata Sans', sans-serif;
    font-size:20px;font-weight:700;margin-bottom:6px;
  }
  .login-card .logo span{color:var(--ruby);}
  .login-card p{font-size:13px;color:var(--gray);margin-bottom:24px;}
  .login-card input[type=password]{
    width:100%;border:1px solid var(--line);padding:12px 14px;
    border-radius:8px;font-size:14px;font-family:inherit;color:var(--ink);
    margin-bottom:14px;
  }
  .login-card input[type=password]:focus{outline:none;border-color:var(--ruby);}
  .login-card button{
    width:100%;background:var(--ruby);color:#fff;border:none;
    padding:12px;border-radius:8px;font-size:14px;cursor:pointer;
  }
  .login-card button:hover{background:var(--ruby-dark);}
  .login-card button:disabled{opacity:.6;cursor:default;}
  .login-error{font-size:12px;color:var(--ruby);margin-top:10px;min-height:16px;}
  .logout-btn{
    font-size:12px;color:var(--gray);background:none;border:none;cursor:pointer;
    margin-left:16px;
  }
  .logout-btn:hover{color:var(--ruby);}

  /* ---------- Header ---------- */
  .admin-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:24px 6vw;
    border-bottom:1px solid var(--line);
    background:#fff;
  }
  .admin-header .logo{
    font-family:'Nata Sans', sans-serif;
    font-size:20px;font-weight:700;
  }
  .admin-header .logo span{color:var(--ruby);}
  .admin-header .logo small{
    font-family:'SUIT', sans-serif;
    font-size:12px;color:var(--gray);
    letter-spacing:1px;margin-left:10px;
    border:1px solid var(--line);border-radius:999px;
    padding:3px 10px;
  }
  .header-right{display:flex;align-items:center;}
  .view-site{font-size:13px;color:var(--ruby);}
  .view-site:hover{text-decoration:underline;}

  .admin-main{
    padding:60px 6vw 160px;
    max-width:1100px;margin:0 auto;
  }
  .admin-section{margin-bottom:110px;}
  .admin-section h2{
    font-family:'SUIT', sans-serif;
    font-size:32px;font-weight:700;margin-bottom:10px;
  }
  .hint{font-size:13px;color:var(--gray);margin-bottom:32px;}

  /* ---------- Tool library ---------- */
  .tool-lib-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px;}
  .tool-lib-item{
    position:relative;
    width:56px;height:56px;
    border:1px solid var(--line);border-radius:8px;
    overflow:hidden;background:#fff;
  }
  .tool-lib-item img{width:100%;height:100%;object-fit:cover;}
  .tool-lib-item button{
    position:absolute;top:2px;right:2px;
    border:none;background:rgba(26,26,26,.6);color:#fff;cursor:pointer;
    font-size:12px;width:18px;height:18px;border-radius:50%;line-height:1;
  }
  .tool-lib-item button:hover{background:var(--ruby);}

  .tool-add-form{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    border:1px solid var(--line);padding:20px;border-radius:12px;background:#fff;
  }
  .primary-btn{
    background:var(--ruby);color:#fff;border:none;
    padding:10px 20px;border-radius:8px;font-size:13px;cursor:pointer;
  }
  .primary-btn:hover{background:var(--ruby-dark);}
  .primary-btn:disabled{opacity:.6;cursor:default;}
  .secondary-btn{
    border:1px solid var(--line);background:none;
    padding:10px 16px;border-radius:8px;font-size:12px;color:var(--gray);cursor:pointer;
  }
  .secondary-btn:hover{border-color:var(--ruby);color:var(--ruby);}

  /* ---------- Project list ---------- */
  .project-card{
    border:1px solid var(--line);border-radius:12px;
    margin-bottom:18px;overflow:hidden;background:#fff;
  }
  .project-card-head{
    display:flex;align-items:center;gap:16px;
    padding:18px 22px;cursor:pointer;
  }
  .ph-thumb{
    width:64px;height:48px;flex:0 0 auto;
    border-radius:6px;border:1px solid var(--line);
    background:#f4efec;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:var(--gray);
  }
  .ph-thumb img{width:100%;height:100%;object-fit:cover;}
  .ph-info{flex:1;min-width:0;}
  .ph-cat{font-size:12px;color:var(--ruby);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
  .ph-title{font-family:'SUIT', sans-serif;font-size:18px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chevron{color:var(--gray);font-size:12px;transition:transform .2s;flex:0 0 auto;}
  .project-card.open .chevron{transform:rotate(180deg);}
  .card-drag-handle{
    flex:0 0 auto;width:20px;text-align:center;
    color:var(--gray);font-size:16px;letter-spacing:-1px;
    cursor:grab;user-select:none;line-height:1;
  }
  .card-drag-handle:active{cursor:grabbing;}
  .project-card.dragging{opacity:.4;}
  .card-delete-btn{
    flex:0 0 auto;border:1px solid var(--line);background:none;
    color:var(--gray);font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;
  }
  .card-delete-btn:hover{border-color:var(--ruby);color:var(--ruby);}
  .cat-input{max-width:220px;}
  .project-card-body{display:none;padding:0 22px 32px;border-top:1px solid var(--line);}
  .project-card.open .project-card-body{display:block;padding-top:28px;}

  .form-grid{display:grid;grid-template-columns:220px 1fr;gap:32px;margin-bottom:32px;}
  @media(max-width:700px){.form-grid{grid-template-columns:1fr;}}

  .thumb-upload{
    aspect-ratio:4/3;border:1px dashed var(--line);border-radius:8px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    position:relative;overflow:hidden;background:#f4efec;
    font-size:12px;color:var(--gray);text-align:center;line-height:1.5;
  }
  .thumb-upload img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

  .form-row{margin-bottom:22px;}
  .form-row:last-child{margin-bottom:0;}
  .form-row label{
    display:block;font-size:12px;color:var(--gray);
    letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;
  }
  .form-row input[type=text]{
    width:100%;border:1px solid var(--line);padding:10px 14px;
    border-radius:8px;font-size:14px;font-family:inherit;color:var(--ink);
  }
  .form-row input[type=text]:focus{outline:none;border-color:var(--ruby);}

  .tool-select-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .tool-select-chip{
    display:flex;align-items:center;justify-content:center;
    width:44px;height:44px;padding:0;
    border:2px solid var(--line);border-radius:8px;
    cursor:pointer;background:#fff;overflow:hidden;
  }
  .tool-select-chip img{width:100%;height:100%;object-fit:cover;}
  .tool-select-chip.selected{border-color:var(--ruby);}
  .tool-select-hint{font-size:12px;color:var(--gray);margin-top:10px;}
  .tool-select-hint.warn{color:var(--ruby);}

  .involve-edit-row{margin-bottom:16px;}
  .involve-edit-row:last-child{margin-bottom:0;}
  .involve-edit-row label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .involve-edit-row input[type=range]{width:100%;accent-color:var(--ruby);}

  .gallery-edit-list{display:flex;flex-direction:column;gap:16px;margin-top:6px;}
  .gallery-edit-item{position:relative;line-height:0;cursor:grab;}
  .gallery-edit-item:active{cursor:grabbing;}
  .gallery-edit-item.dragging{opacity:.4;}
  .gallery-edit-item img{width:100%;border-radius:8px;border:1px solid var(--line);display:block;pointer-events:none;}
  .gallery-edit-item button{
    position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;
    background:rgba(26,26,26,.6);color:#fff;border:none;cursor:pointer;font-size:15px;
  }
  .gallery-edit-item button:hover{background:var(--ruby);}
  .gallery-edit-add{
    border:1px dashed var(--line);border-radius:8px;padding:22px;
    text-align:center;font-size:13px;color:var(--gray);cursor:pointer;
    background:none;width:100%;
  }
  .gallery-edit-add:hover{border-color:var(--ruby);color:var(--ruby);}

  .empty-state{font-size:13px;color:var(--gray);padding:24px 0;}
  .save-status{font-size:11px;color:var(--gray);margin-left:10px;}
</style>
</head>
<body>

<div id="loginGate">
  <div class="login-card">
    <div class="logo">Ruby<span>bay</span> studio</div>
    <p>관리자 페이지 — 비밀번호를 입력하세요.</p>
    <form id="loginForm">
      <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password" required>
      <button type="submit" id="loginSubmit">로그인</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>

<header class="admin-header">
  <div class="logo">Ruby<span>bay</span> studio <small>관리자 페이지</small></div>
  <div class="header-right">
    <a class="view-site" href="work.html">사이트 보기 →</a>
    <button type="button" class="logout-btn" id="logoutBtn">로그아웃</button>
  </div>
</header>

<main class="admin-main">

  <section class="admin-section">
    <h2>도구 라이브러리</h2>
    <p class="hint">프로젝트에서 선택할 수 있는 작업 툴 아이콘을 정사각형 이미지로 등록하세요. 등록한 아이콘은 모든 프로젝트에서 재사용할 수 있어요.</p>

    <div class="tool-lib-grid" id="toolLibGrid"></div>

    <div class="tool-add-form">
      <button type="button" id="newToolImageBtn" class="secondary-btn">이미지 선택</button>
      <input type="file" accept="image/*" class="hidden-input" id="newToolImageInput">
      <button type="button" id="addToolBtn" class="primary-btn">+ 도구 추가</button>
      <span class="save-status" id="toolSaveStatus"></span>
    </div>
  </section>

  <section class="admin-section">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:10px;">
      <div>
        <h2 style="margin-bottom:0;">프로젝트 관리</h2>
      </div>
      <button type="button" id="addProjectBtn" class="primary-btn">+ 새 프로젝트 추가</button>
    </div>
    <p class="hint">카드를 클릭해서 펼치고 내용을 수정하세요. 모든 변경 사항은 자동 저장되고, 사이트(work.html, 메인 미리보기 6개 포함)에도 바로 반영돼요.</p>
    <div id="projectList"></div>
  </section>

</main>

<input type="file" accept="image/*" class="hidden-input" id="thumbFileInput">
<input type="file" accept="image/*" multiple class="hidden-input" id="galleryFileInput">

<script>
  // ============ helpers ============
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function api(path, options) {
    const res = await fetch(path, {
      credentials: 'same-origin',
      ...options,
      headers: { 'content-type': 'application/json', ...(options && options.headers) },
    });
    if (res.status === 401) {
      document.body.classList.remove('authed');
      throw new Error('unauthorized');
    }
    if (!res.ok) throw new Error('request_failed:' + res.status);
    if (res.status === 204) return null;
    return res.json();
  }

  async function uploadFile(file) {
    const form = new FormData();
    form.append('file', file);
    const res = await fetch('/api/upload', { method: 'POST', credentials: 'same-origin', body: form });
    if (res.status === 401) {
      document.body.classList.remove('authed');
      throw new Error('unauthorized');
    }
    if (!res.ok) throw new Error('upload_failed:' + res.status);
    const data = await res.json();
    return data.url;
  }

  // ============ Auth gate ============
  const loginForm = document.getElementById('loginForm');
  const loginPassword = document.getElementById('loginPassword');
  const loginError = document.getElementById('loginError');
  const loginSubmit = document.getElementById('loginSubmit');
  const logoutBtn = document.getElementById('logoutBtn');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.textContent = '';
    loginSubmit.disabled = true;
    loginSubmit.textContent = '확인 중...';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: loginPassword.value }),
      });
      if (!res.ok) {
        loginError.textContent = '비밀번호가 올바르지 않아요.';
        return;
      }
      document.body.classList.add('authed');
      loginPassword.value = '';
      await init();
    } catch (err) {
      loginError.textContent = '연결에 실패했어요. 잠시 후 다시 시도해주세요.';
    } finally {
      loginSubmit.disabled = false;
      loginSubmit.textContent = '로그인';
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
    document.body.classList.remove('authed');
  });

  // ============ Data (loaded from the API on init) ============
  let TOOLS = [];
  let ORDER = [];
  const PROJECTS = {};
  const openIds = new Set();
  const saveTimers = {};

  function getTool(id) { return TOOLS.find(t => t.id === id); }
  function toolIconHtml(tool) {
    if (!tool) return '';
    if (tool.icon && tool.icon.type === 'image' && tool.icon.value) {
      return `<img src="${tool.icon.value}" alt="">`;
    }
    return `<span class="chip-emoji">${(tool.icon && tool.icon.value) || '🔧'}</span>`;
  }

  async function loadData() {
    const [projects, tools] = await Promise.all([
      api('/api/projects'),
      api('/api/tools'),
    ]);
    TOOLS = tools;
    ORDER = projects.map(p => p.id);
    Object.keys(PROJECTS).forEach(k => delete PROJECTS[k]);
    projects.forEach(p => { PROJECTS[p.id] = p; });
  }

  function scheduleSave(pid) {
    clearTimeout(saveTimers[pid]);
    saveTimers[pid] = setTimeout(() => saveProject(pid), 600);
  }

  async function saveProject(id) {
    try {
      await api(`/api/projects/${id}`, { method: 'PUT', body: JSON.stringify(PROJECTS[id]) });
    } catch (err) { /* best-effort; UI already reflects the change locally */ }
  }

  async function createProject() {
    const created = await api('/api/projects', { method: 'POST', body: JSON.stringify({}) });
    PROJECTS[created.id] = created;
    ORDER.push(created.id);
    openIds.add(created.id);
    renderProjectList();
    const card = projectList.querySelector(`.project-card[data-pid="${created.id}"]`);
    if (card && typeof card.scrollIntoView === 'function') card.scrollIntoView({ behavior:'smooth', block:'center' });
  }

  async function deleteProject(id) {
    if (!confirm('이 프로젝트를 삭제할까요? 되돌릴 수 없어요.')) return;
    await api(`/api/projects/${id}`, { method: 'DELETE' });
    ORDER = ORDER.filter(pid => pid !== id);
    delete PROJECTS[id];
    openIds.delete(id);
    renderProjectList();
  }

  // ============ Tool library UI ============
  const toolLibGrid = document.getElementById('toolLibGrid');
  const newToolImageBtn = document.getElementById('newToolImageBtn');
  const newToolImageInput = document.getElementById('newToolImageInput');
  const addToolBtn = document.getElementById('addToolBtn');
  const toolSaveStatus = document.getElementById('toolSaveStatus');

  let pendingToolFile = null;

  newToolImageBtn.addEventListener('click', () => newToolImageInput.click());
  newToolImageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    pendingToolFile = file;
    newToolImageBtn.textContent = '이미지 선택됨 ✓';
  });

  function renderToolLib() {
    toolLibGrid.innerHTML = TOOLS.map(t => `
      <div class="tool-lib-item">
        ${toolIconHtml(t)}
        <button type="button" data-del="${t.id}" title="삭제">&times;</button>
      </div>
    `).join('') || '<p class="empty-state">등록된 도구가 없어요. 아래에서 추가해보세요.</p>';
  }

  toolLibGrid.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-del]');
    if (!btn) return;
    const tid = btn.dataset.del;
    if (!confirm('이 도구를 삭제하면 사용 중인 모든 프로젝트에서도 함께 제거돼요. 삭제할까요?')) return;
    await api(`/api/tools/${tid}`, { method: 'DELETE' });
    TOOLS = TOOLS.filter(t => t.id !== tid);
    const affected = Object.keys(PROJECTS).filter(pid => PROJECTS[pid].tools.includes(tid));
    affected.forEach(pid => { PROJECTS[pid].tools = PROJECTS[pid].tools.filter(t => t !== tid); });
    await Promise.all(affected.map(pid => saveProject(pid)));
    renderToolLib();
    renderProjectList();
  });

  addToolBtn.addEventListener('click', async () => {
    if (!pendingToolFile) { alert('아이콘 이미지를 먼저 선택해주세요.'); return; }
    addToolBtn.disabled = true;
    toolSaveStatus.textContent = '업로드 중...';
    try {
      const url = await uploadFile(pendingToolFile);
      const created = await api('/api/tools', { method: 'POST', body: JSON.stringify({ value: url }) });
      TOOLS.push(created);

      pendingToolFile = null;
      newToolImageBtn.textContent = '이미지 선택';
      newToolImageInput.value = '';
      toolSaveStatus.textContent = '';

      renderToolLib();
      renderProjectList();
    } catch (err) {
      toolSaveStatus.textContent = '업로드 실패';
    } finally {
      addToolBtn.disabled = false;
    }
  });

  // ============ Project list UI ============
  const projectList = document.getElementById('projectList');
  const thumbFileInput = document.getElementById('thumbFileInput');
  const galleryFileInput = document.getElementById('galleryFileInput');
  const addProjectBtn = document.getElementById('addProjectBtn');
  let pendingThumbPid = null;
  let pendingGalleryPid = null;

  addProjectBtn.addEventListener('click', createProject);

  function toolSelectHtml(pid) {
    const p = PROJECTS[pid];
    const chips = TOOLS.map(t => `
      <button type="button" class="tool-select-chip${p.tools.includes(t.id) ? ' selected' : ''}" data-pid="${pid}" data-tid="${t.id}" title="${escapeHtml(t.name)}">
        ${toolIconHtml(t)}
      </button>
    `).join('') || '<p class="empty-state">먼저 위에서 도구를 등록해주세요.</p>';
    return `<div class="tool-select-grid">${chips}</div>
      <div class="tool-select-hint" id="tool-hint-${pid}">현재 ${p.tools.length}개 선택됨 (최소 1개, 최대 8개)</div>`;
  }

  function galleryEditHtml(pid) {
    const p = PROJECTS[pid];
    const items = p.gallery.map((src, idx) => `
      <div class="gallery-edit-item" data-pid="${pid}" data-idx="${idx}">
        <img src="${src}" alt="">
        <button type="button" data-pid="${pid}" data-idx="${idx}">&times;</button>
      </div>
    `).join('');
    return `<div class="gallery-edit-list">
      ${items}
      <button type="button" class="gallery-edit-add" data-pid="${pid}">+ 이미지 추가</button>
    </div>`;
  }

  function projectCardHtml(pid) {
    const p = PROJECTS[pid];
    const thumbHtml = p.thumb ? `<img src="${p.thumb}" alt="">` : '🖼';
    const thumbUploadHtml = p.thumb ? `<img src="${p.thumb}" alt="">` : '클릭해서<br>대표 이미지 업로드';
    return `
    <div class="project-card" data-pid="${pid}">
      <div class="project-card-head" data-pid="${pid}">
        <div class="card-drag-handle" title="드래그해서 순서 변경">⠿</div>
        <div class="ph-thumb">${thumbHtml}</div>
        <div class="ph-info">
          <div class="ph-cat">${escapeHtml(p.catLabel) || '(분류 없음)'}</div>
          <div class="ph-title" id="ph-title-${pid}">${escapeHtml(p.title) || '(제목 없음)'}</div>
        </div>
        <button type="button" class="card-delete-btn" data-del-pid="${pid}">삭제</button>
        <div class="chevron">▾</div>
      </div>
      <div class="project-card-body">
        <div class="form-grid">
          <div class="thumb-upload" data-pid="${pid}">${thumbUploadHtml}</div>
          <div>
            <div class="form-row">
              <label>분류</label>
              <input type="text" class="cat-input cat-input-field" data-pid="${pid}" value="${escapeHtml(p.catLabel)}" placeholder="예: 브랜드 디자인">
            </div>
            <div class="form-row">
              <label>프로젝트 이름</label>
              <input type="text" class="title-input" data-pid="${pid}" value="${escapeHtml(p.title)}">
            </div>
            <div class="form-row">
              <label>설명</label>
              <input type="text" class="desc-input" data-pid="${pid}" value="${escapeHtml(p.desc)}" placeholder="예: 브랜드 아이덴티티 · 로고 · 가이드라인">
            </div>
            <div class="form-row">
              <label>작업 기간</label>
              <input type="text" class="period-input" data-pid="${pid}" value="${escapeHtml(p.period)}" placeholder="예: 2024.01 – 2024.03">
            </div>
            <div class="form-row">
              <label>작업 비용</label>
              <input type="text" class="cost-input" data-pid="${pid}" value="${escapeHtml(p.cost)}" placeholder="예: 3,000,000원">
            </div>
          </div>
        </div>

        <div class="form-row">
          <label>작업한 툴</label>
          ${toolSelectHtml(pid)}
        </div>

        <div class="form-row">
          <label>작업 관여도</label>
          <div class="involve-edit-row">
            <label><span>기획</span><span id="planning-live-${pid}">${p.planning}%</span></label>
            <input type="range" class="planning-range" data-pid="${pid}" min="0" max="100" value="${p.planning}">
          </div>
          <div class="involve-edit-row">
            <label><span>디자인</span><span id="design-live-${pid}">${p.design}%</span></label>
            <input type="range" class="design-range" data-pid="${pid}" min="0" max="100" value="${p.design}">
          </div>
        </div>

        <div class="form-row">
          <label>작업 이미지</label>
          ${galleryEditHtml(pid)}
        </div>
      </div>
    </div>`;
  }

  function renderProjectList() {
    projectList.innerHTML = ORDER.map(projectCardHtml).join('') || '<p class="empty-state">등록된 프로젝트가 없어요. 위 버튼으로 추가해보세요.</p>';
    openIds.forEach(pid => {
      const el = projectList.querySelector(`.project-card[data-pid="${pid}"]`);
      if (el) el.classList.add('open');
    });
  }

  function flashToolHint(pid, msg) {
    const el = document.getElementById(`tool-hint-${pid}`);
    if (!el) return;
    const original = `현재 ${PROJECTS[pid].tools.length}개 선택됨 (최소 1개, 최대 8개)`;
    el.textContent = msg;
    el.classList.add('warn');
    setTimeout(() => {
      el.textContent = original;
      el.classList.remove('warn');
    }, 1800);
  }

  function toggleProjectTool(pid, tid) {
    const p = PROJECTS[pid];
    const has = p.tools.includes(tid);
    if (has) {
      if (p.tools.length <= 1) { flashToolHint(pid, '최소 1개는 선택되어 있어야 해요.'); return; }
      p.tools = p.tools.filter(t => t !== tid);
    } else {
      if (p.tools.length >= 8) { flashToolHint(pid, '최대 8개까지만 선택할 수 있어요.'); return; }
      p.tools.push(tid);
    }
    saveProject(pid);
    renderProjectList();
  }

  async function saveOrder() {
    try {
      await api('/api/projects/reorder', { method: 'POST', body: JSON.stringify({ order: ORDER }) });
    } catch (err) {
      // ignore; next successful save will reconcile
    }
  }

  // ---- drag-to-reorder (pointer-based; native HTML5 DnD was unreliable across browsers) ----
  let dragPid = null;

  function reapplyDraggingClass() {
    if (!dragPid) return;
    const el = projectList.querySelector(`.project-card[data-pid="${dragPid}"]`);
    if (el) el.classList.add('dragging');
  }

  function onDragPointerMove(e) {
    if (!dragPid) return;
    const target = document.elementFromPoint(e.clientX, e.clientY);
    if (!target) return;
    const hoveredCard = target.closest('.project-card');
    if (!hoveredCard) return;
    const hoveredPid = hoveredCard.dataset.pid;
    if (!hoveredPid || hoveredPid === dragPid) return;
    const fromIdx = ORDER.indexOf(dragPid);
    const toIdx = ORDER.indexOf(hoveredPid);
    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
    ORDER.splice(fromIdx, 1);
    ORDER.splice(toIdx, 0, dragPid);
    renderProjectList();
    reapplyDraggingClass();
  }

  function onDragPointerUp() {
    if (!dragPid) return;
    dragPid = null;
    document.body.style.userSelect = '';
    document.removeEventListener('mousemove', onDragPointerMove);
    document.removeEventListener('mouseup', onDragPointerUp);
    projectList.querySelectorAll('.project-card.dragging').forEach(el => el.classList.remove('dragging'));
    saveOrder();
  }

  projectList.addEventListener('mousedown', (e) => {
    const galItem = e.target.closest('.gallery-edit-item');
    if (galItem && !e.target.closest('button')) {
      e.preventDefault();
      galDragPid = galItem.dataset.pid;
      galDragIdx = Number(galItem.dataset.idx);
      document.body.style.userSelect = 'none';
      galItem.classList.add('dragging');
      document.addEventListener('mousemove', onGalPointerMove);
      document.addEventListener('mouseup', onGalPointerUp);
      return;
    }

    const handle = e.target.closest('.card-drag-handle');
    if (!handle) return;
    const card = handle.closest('.project-card');
    if (!card) return;
    e.preventDefault();
    dragPid = card.dataset.pid;
    document.body.style.userSelect = 'none';
    card.classList.add('dragging');
    document.addEventListener('mousemove', onDragPointerMove);
    document.addEventListener('mouseup', onDragPointerUp);
  });

  // ---- gallery image drag-to-reorder ----
  let galDragPid = null;
  let galDragIdx = null;

  function reapplyGalDraggingClass() {
    if (galDragPid === null || galDragIdx === null) return;
    const el = projectList.querySelector(`.gallery-edit-item[data-pid="${galDragPid}"][data-idx="${galDragIdx}"]`);
    if (el) el.classList.add('dragging');
  }

  function onGalPointerMove(e) {
    if (galDragPid === null) return;
    const target = document.elementFromPoint(e.clientX, e.clientY);
    if (!target) return;
    const hoveredItem = target.closest('.gallery-edit-item');
    if (!hoveredItem || hoveredItem.dataset.pid !== galDragPid) return;
    const hoveredIdx = Number(hoveredItem.dataset.idx);
    if (hoveredIdx === galDragIdx) return;
    const arr = PROJECTS[galDragPid].gallery;
    const [moved] = arr.splice(galDragIdx, 1);
    arr.splice(hoveredIdx, 0, moved);
    galDragIdx = hoveredIdx;
    renderProjectList();
    reapplyGalDraggingClass();
  }

  function onGalPointerUp() {
    if (galDragPid === null) return;
    const pid = galDragPid;
    galDragPid = null;
    galDragIdx = null;
    document.body.style.userSelect = '';
    document.removeEventListener('mousemove', onGalPointerMove);
    document.removeEventListener('mouseup', onGalPointerUp);
    projectList.querySelectorAll('.gallery-edit-item.dragging').forEach(el => el.classList.remove('dragging'));
    saveProject(pid);
  }

  projectList.addEventListener('click', (e) => {
    const delBtn = e.target.closest('.card-delete-btn');
    if (delBtn) { deleteProject(delBtn.dataset.delPid); return; }

    const head = e.target.closest('.project-card-head');
    if (head) {
      const pid = head.dataset.pid;
      const card = head.closest('.project-card');
      card.classList.toggle('open');
      if (card.classList.contains('open')) openIds.add(pid); else openIds.delete(pid);
      return;
    }

    const toolChip = e.target.closest('.tool-select-chip');
    if (toolChip) { toggleProjectTool(toolChip.dataset.pid, toolChip.dataset.tid); return; }

    const thumbBtn = e.target.closest('.thumb-upload');
    if (thumbBtn) { pendingThumbPid = thumbBtn.dataset.pid; thumbFileInput.click(); return; }

    const galleryAddBtn = e.target.closest('.gallery-edit-add');
    if (galleryAddBtn) { pendingGalleryPid = galleryAddBtn.dataset.pid; galleryFileInput.click(); return; }

    const galleryRemoveBtn = e.target.closest('.gallery-edit-item button');
    if (galleryRemoveBtn) {
      const pid = galleryRemoveBtn.dataset.pid;
      const idx = Number(galleryRemoveBtn.dataset.idx);
      PROJECTS[pid].gallery.splice(idx, 1);
      saveProject(pid);
      renderProjectList();
      return;
    }
  });

  projectList.addEventListener('input', (e) => {
    const pid = e.target.dataset.pid;
    if (!pid) return;

    if (e.target.classList.contains('cat-input-field')) {
      PROJECTS[pid].catLabel = e.target.value;
      scheduleSave(pid);
      const head = projectList.querySelector(`.project-card[data-pid="${pid}"] .ph-cat`);
      if (head) head.textContent = e.target.value || '(분류 없음)';
    }
    if (e.target.classList.contains('title-input')) {
      PROJECTS[pid].title = e.target.value;
      scheduleSave(pid);
      const headTitle = document.getElementById(`ph-title-${pid}`);
      if (headTitle) headTitle.textContent = e.target.value || '(제목 없음)';
    }
    if (e.target.classList.contains('desc-input')) {
      PROJECTS[pid].desc = e.target.value;
      scheduleSave(pid);
    }
    if (e.target.classList.contains('period-input')) {
      PROJECTS[pid].period = e.target.value;
      scheduleSave(pid);
    }
    if (e.target.classList.contains('cost-input')) {
      PROJECTS[pid].cost = e.target.value;
      scheduleSave(pid);
    }
    if (e.target.classList.contains('planning-range')) {
      PROJECTS[pid].planning = Number(e.target.value);
      const live = document.getElementById(`planning-live-${pid}`);
      if (live) live.textContent = e.target.value + '%';
      scheduleSave(pid);
    }
    if (e.target.classList.contains('design-range')) {
      PROJECTS[pid].design = Number(e.target.value);
      const live = document.getElementById(`design-live-${pid}`);
      if (live) live.textContent = e.target.value + '%';
      scheduleSave(pid);
    }
  });

  thumbFileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !pendingThumbPid) return;
    const pid = pendingThumbPid;
    try {
      const url = await uploadFile(file);
      PROJECTS[pid].thumb = url;
      await saveProject(pid);
      renderProjectList();
      const card = projectList.querySelector(`.project-card[data-pid="${pid}"]`);
      if (card) card.classList.add('open');
      openIds.add(pid);
    } catch (err) {
      alert('이미지 업로드에 실패했어요. 다시 시도해주세요.');
    }
    thumbFileInput.value = '';
  });

  galleryFileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length || !pendingGalleryPid) return;
    const pid = pendingGalleryPid;
    try {
      const urls = await Promise.all(files.map(uploadFile));
      PROJECTS[pid].gallery.push(...urls);
      await saveProject(pid);
      renderProjectList();
      openIds.add(pid);
      const card = projectList.querySelector(`.project-card[data-pid="${pid}"]`);
      if (card) card.classList.add('open');
    } catch (err) {
      alert('이미지 업로드에 실패했어요. 다시 시도해주세요.');
    }
    galleryFileInput.value = '';
  });

  // ============ init ============
  async function init() {
    await loadData();
    renderToolLib();
    renderProjectList();
  }

  (async () => {
    try {
      const session = await fetch('/api/session', { credentials: 'same-origin' }).then(r => r.json());
      if (session.authenticated) {
        document.body.classList.add('authed');
        await init();
      }
    } catch (err) { /* show login gate on any failure */ }
  })();
</script>

</body>
</html>
