<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루비베이스튜디오 | RUBYBAY STUDIO</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nata+Sans:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  /* SUIT — Light(200) / Medium(500) / Bold(700) only */
  @font-face{
    font-family:'SUIT';
    font-weight:200;
    font-style:normal;
    font-display:swap;
    src:url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT-ExtraLight.woff2') format('woff2');
  }
  @font-face{
    font-family:'SUIT';
    font-weight:500;
    font-style:normal;
    font-display:swap;
    src:url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT-Medium.woff2') format('woff2');
  }
  @font-face{
    font-family:'SUIT';
    font-weight:700;
    font-style:normal;
    font-display:swap;
    src:url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT-Bold.woff2') format('woff2');
  }

  :root{
    --ruby:#b61d22;
    --ruby-dark:#761316;
    --ink:#1a1a1a;
    --gray:#6b6b6b;
    --line:#e6e2e0;
    --bg:#fdfcfb;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'SUIT', sans-serif;
    color:var(--ink);
    background:var(--bg);
    line-height:1.7;
    font-weight:200;
    letter-spacing:-0.03em;
  }
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;}
  .serif{font-family:'SUIT', sans-serif;font-weight:700;}

  /* ---------- Header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:flex-start;align-items:center;
    gap:100px;
    padding:28px 6vw;
    z-index:100;
    background:rgba(12,12,12,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid transparent;
    transition:border-color .3s;
  }
  header.scrolled{border-bottom-color:rgba(255,255,255,0.12);}
  .logo{
    font-family:'Nata Sans', sans-serif;
    font-size:22px;
    font-weight:700;
    color:var(--ruby);
  }
  nav ul{display:flex;gap:52px;list-style:none;}
  nav a{
    position:relative;
    display:inline-block;
    font-family:'Nata Sans', sans-serif;
    font-size:19px;
    letter-spacing:-0.02em;
    font-weight:300;
    color:rgba(255,255,255,0.65);
    transition:color .25s;
  }
  nav a:hover{color:var(--ruby);}
  nav a .txt-en{opacity:1;transition:opacity .2s ease;}
  nav a .txt-ko{
    position:absolute;left:50%;top:0;
    transform:translateX(-50%);
    opacity:0;white-space:nowrap;
    font-family:'SUIT', sans-serif;
    font-weight:300;
    transition:opacity .2s ease, font-weight .2s ease;
  }
  nav a:hover .txt-en{opacity:0;}
  nav a:hover .txt-ko{opacity:1;font-weight:700;}
  .nav-toggle{display:none;margin-left:auto;font-size:22px;background:none;border:none;cursor:pointer;color:#fff;}

  @media(max-width:760px){
    nav ul{
      position:fixed;top:76px;left:0;right:0;
      flex-direction:column;gap:0;
      background:#0c0c0c;
      border-bottom:1px solid rgba(255,255,255,0.12);
      transform:translateY(-120%);
      transition:transform .3s;
    }
    nav ul.open{transform:translateY(0);}
    nav ul li{border-top:1px solid rgba(255,255,255,0.12);}
    nav ul li a{display:block;padding:18px 6vw;}
    nav ul li a .txt-ko{left:6vw;top:18px;transform:none;}
    .nav-toggle{display:block;}
    header{gap:20px;padding:20px 6vw;}
    .logo{white-space:nowrap;font-size:17px;}
  }

  /* ---------- Hero ---------- */
  .hero{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:267px 6vw 160px;
    position:relative;
    overflow:hidden;
  }
  /* Background layer — image OR video both work here.
     Image: add a style attribute on .hero-bg like
       style="background-image:url('images/hero.jpg')"
     Video: uncomment the <video class="hero-bg-video"> tag in the HTML
       below and point its <source> at your video file. When a video is
       present it sits on top of .hero-bg and covers it automatically.
     The veil (.hero-veil) keeps the text readable over either one —
     lower its opacity if you want the photo/video to show through more. */
  .hero-media{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .hero-bg{
    position:absolute;
    inset:0;
    background:#0c0c0c;
    background-size:cover;
    background-position:center;
  }
  .hero-bg-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .hero-veil{
    position:absolute;
    inset:0;
    background:rgba(12,12,12,0.55);
  }
  .hero-content{
    position:relative;
    z-index:1;
    max-width:760px;
    width:100%;
  }
  .hero h1{
    font-family:'SUIT', sans-serif;
    font-weight:500;
    font-size:64px;
    line-height:1.2;
    letter-spacing:-0.03em;
    color:#fff;
  }
  .hero-contact{margin-top:80px;}
  .hero-contact .email-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
  }
  .hero-contact .contact-label{
    font-family:'SUIT', sans-serif;
    font-weight:500;
    font-size:18px;
    color:rgba(255,255,255,0.5);
    letter-spacing:-0.02em;
    padding-bottom:8px;
    border-bottom:1px solid transparent;
    transition:border-color .25s, color .25s;
  }
  .hero-contact .contact-label:hover{
    color:#fff;
    border-bottom-color:rgba(255,255,255,0.6);
  }
  .hero-contact .email{
    display:inline-block;
    font-family:'SUIT', sans-serif;
    font-weight:700;
    font-size:24px;
    color:var(--ruby);
    padding-bottom:8px;
    letter-spacing:-0.02em;
  }
  .hero-contact .contact-links{
    display:flex;
    justify-content:center;
    gap:32px;
    flex-wrap:wrap;
    font-size:13px;
    letter-spacing:-0.02em;
    color:rgba(255,255,255,0.55);
  }
  .hero-contact .contact-links a:hover{font-weight:700;}

  section{padding:150px 6vw;}
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:80px;
    gap:20px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
    padding-bottom:32px;
  }
  .section-head .tag{
    font-size:12px;
    letter-spacing:3px;
    color:var(--ruby);
    text-transform:uppercase;
    margin-bottom:14px;
    display:block;
  }
  .section-head h2{
    font-family:'SUIT', sans-serif;
    font-size:clamp(30px,4vw,52px);
    font-weight:700;
  }
  .section-head p{
    flex:1 1 420px;
    max-width:560px;
    font-size:14px;
    color:var(--gray);
  }

  /* ---------- Portfolio (preview — first 6, full list lives on work.html) ---------- */
  .portfolio{background:#0c0c0c;padding:80px 0 0;}
  .portfolio-head{
    display:flex;justify-content:flex-start;align-items:center;
    gap:14px;
    padding:0 6vw;
    margin-bottom:32px;
  }
  .portfolio-title{
    font-family:'Nata Sans', sans-serif;
    font-size:clamp(22px,2.4vw,30px);
    font-weight:700;
    letter-spacing:1px;
    color:#fff;
  }
  .portfolio-viewall{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Nata Sans', sans-serif;
    font-size:clamp(22px,2.4vw,30px);
    line-height:1;
    font-weight:700;
    color:rgba(255,255,255,0.6);
    transition:color .2s;
  }
  .portfolio-viewall:hover{color:var(--ruby);}

  .portfolio-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:3px;
  }
  @media(max-width:900px){
    .portfolio-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media(max-width:560px){
    .portfolio-grid{grid-template-columns:1fr;}
  }

  .portfolio-tile{
    position:relative;
    aspect-ratio:16/9;
    background:#1a1a1a;
    overflow:hidden;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .portfolio-tile::before{
    content:attr(data-cat);
    font-family:'Nata Sans', sans-serif;
    font-weight:500;
    font-size:16px;
    color:rgba(255,255,255,0.6);
    letter-spacing:0.3px;
    text-transform:lowercase;
    padding-bottom:4px;
    border-bottom:1px solid var(--ruby);
  }
  .portfolio-tile.has-image::before{display:none;}
  .portfolio-tile img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    transition:transform .6s ease;
  }
  .portfolio-tile:hover img{transform:scale(1.06);}
  .portfolio-tile-info{
    position:absolute;inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    opacity:0;
    transition:opacity .3s ease;
  }
  .portfolio-tile:hover .portfolio-tile-info{
    opacity:1;
  }
  .portfolio-tile-info h3{
    font-family:'SUIT', sans-serif;
    font-size:18px;font-weight:700;
    color:#fff;
    margin-bottom:8px;
  }
  .portfolio-tile-info p{font-size:12px;color:rgba(255,255,255,0.75);}

  footer{
    padding:80px 6vw;
    background:var(--ruby);
    border-top:1px solid rgba(255,255,255,0.12);
    position:relative;
    overflow:hidden;
  }
  .footer-logo-bg{
    position:absolute;
    top:50%;
    right:15px;
    transform:translateY(-50%);
    width:420px;
    height:420px;
    color:var(--ruby-dark);
    opacity:0.45;
    pointer-events:none;
  }
  .footer-content{
    position:relative;
    z-index:1;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:48px;
    flex-wrap:wrap;
  }
  .footer-text{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    gap:16px;
    font-size:12px;
    color:#c9a6ae;
  }
  .footer-biz{
    font-size:12px;
    line-height:1.9;
    color:rgba(201,166,174,0.85);
  }
  .footer-meta{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    font-family:'Nata Sans', sans-serif;
  }

  .fade-up{
    opacity:0;
    transform:translateY(24px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .fade-up.show{opacity:1;transform:translateY(0);}
</style>
</head>

<script>
  // ============ header scroll style ============
  const header = document.getElementById('siteHeader');
  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 20);
  });

  // ============ mobile nav toggle ============
  const navToggle = document.getElementById('navToggle');
  const navList = document.getElementById('navList');
  navToggle.addEventListener('click', () => navList.classList.toggle('open'));
  navList.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navList.classList.remove('open')));

  // ============ fade-up reveal ============
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('show'); });
  }, {threshold:0.15});
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

  // ============ Portfolio preview (first 6 — API-backed, full list on work.html) ============
  function seedOrder() { return ['p1','p2','p3','p4','p5','p6']; }
  let ORDER = [];

  function defaultProject() {
    return { catLabel:'', desc:'', title:'프로젝트 제목을 입력하세요', period:'', tools:[], planning:0, design:0, cost:'', thumb:null, gallery:[] };
  }
  const PROJECT_DEFAULTS = {
    p1: { catLabel:'브랜드 디자인', desc:'브랜드 아이덴티티 · 로고 · 가이드라인' },
    p2: { catLabel:'상세페이지', desc:'제품 상세페이지 · 스토리보드' },
    p3: { catLabel:'PPT 디자인', desc:'제안서 · IR덱 · 사내 보고서' },
    p4: { catLabel:'패키지 디자인', desc:'제품 패키지 · 라벨 · 굿즈' },
    p5: { catLabel:'마케팅 디자인', desc:'SNS 콘텐츠 · 배너 · 캠페인 비주얼' },
    p6: { catLabel:'브랜드 디자인', desc:'브랜드 아이덴티티 · 로고 · 가이드라인' },
  };

  function fallbackProject(id) {
    return Object.assign(defaultProject(), PROJECT_DEFAULTS[id] || {});
  }

  const PROJECTS = {};

  // Tries the live API first (real data managed in admin.html); falls back
  // to the hardcoded defaults above if the backend isn't reachable yet.
  async function loadData() {
    try {
      const projects = await fetch('/api/projects').then(r => { if (!r.ok) throw new Error('bad_response'); return r.json(); });
      if (!Array.isArray(projects) || !projects.length) throw new Error('empty');
      ORDER = projects.map(p => p.id);
      projects.forEach(p => { PROJECTS[p.id] = p; });
    } catch (e) {
      ORDER = seedOrder();
      ORDER.forEach(id => { PROJECTS[id] = fallbackProject(id); });
    }
  }

  const CATEGORY_EN = {
    '브랜드 디자인':'BRAND',
    '상세페이지':'DETAIL',
    'PPT 디자인':'PPT',
    '패키지 디자인':'PACKAGE',
    '마케팅 디자인':'MARKETING',
  };
  function categoryEn(catLabel) { return CATEGORY_EN[catLabel] || 'WORK'; }

  const portfolioGrid = document.getElementById('portfolioGrid');

  function renderPortfolioPreview() {
    portfolioGrid.innerHTML = '';
    ORDER.slice(0, 6).forEach(id => {
      const p = PROJECTS[id];
      const tile = document.createElement('a');
      tile.className = 'portfolio-tile' + (p.thumb ? ' has-image' : '');
      tile.dataset.cat = categoryEn(p.catLabel);
      tile.href = 'work.html#' + id;

      if (p.thumb) {
        const img = document.createElement('img');
        img.src = p.thumb;
        tile.appendChild(img);
      }

      const info = document.createElement('div');
      info.className = 'portfolio-tile-info';
      const titleEl = document.createElement('h3');
      titleEl.textContent = p.title || '프로젝트 제목을 입력하세요';
      const descEl = document.createElement('p');
      descEl.textContent = p.desc || p.catLabel || '';
      info.appendChild(titleEl);
      info.appendChild(descEl);
      tile.appendChild(info);

      portfolioGrid.appendChild(tile);
    });
  }

  (async () => {
    await loadData();
    renderPortfolioPreview();
  })();
</script>

</body>
</html>
